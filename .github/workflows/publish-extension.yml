name: Publish extension

# Publishes the Chipwright VS Code extension. Trigger by pushing a tag that matches the
# extension version, e.g. ide-v0.1.1 (the tag suffix must equal apps/ide/package.json version).
# The Twin debugger needs a native binary, so the extension is published as platform-specific
# packages (one per OS/arch, each carrying that platform's prebuilt twin) plus a universal
# fallback with no bundled twin for any other platform. workflow_dispatch with dry_run packages
# without publishing, to rehearse.
on:
  push:
    tags:
      - "ide-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only; do not publish"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Platform-specific packages: each runner builds the twin for its own OS/arch and bundles it.
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build
      - name: Verify the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/ide/package.json').version")
          tag="${GITHUB_REF_NAME#ide-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ide-v$tag does not match apps/ide/package.json version $version." >&2
            exit 1
          fi
      - name: Package (${{ matrix.target }})
        working-directory: apps/ide
        run: npx --yes @vscode/vsce@latest package --target ${{ matrix.target }} --no-dependencies --out "chipwright-${{ matrix.target }}.vsix"
      - name: Publish to the VS Code Marketplace
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/ide
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set (see apps/ide/PUBLISHING.md)." >&2
            exit 1
          fi
          npx --yes @vscode/vsce@latest publish --target ${{ matrix.target }} --no-dependencies --packagePath "chipwright-${{ matrix.target }}.vsix"
      - name: Publish to Open VSX (optional; runs only when OVSX_PAT is set)
        if: ${{ inputs.dry_run != true && env.OVSX_PAT != '' }}
        working-directory: apps/ide
        run: npx --yes ovsx@latest publish --target ${{ matrix.target }} "chipwright-${{ matrix.target }}.vsix" -p "$OVSX_PAT"
      - name: Upload the .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipwright-${{ matrix.target }}
          path: apps/ide/chipwright-${{ matrix.target }}.vsix
      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/ide
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Chipwright $GITHUB_REF_NAME" --notes "Chipwright VS Code extension $GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "chipwright-${{ matrix.target }}.vsix" --clobber

  # Universal fallback: no bundled twin, so any platform not covered above still installs (the
  # Twin tab then builds from source in the Chipwright workspace, or reports it is unavailable).
  universal:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      CHIPWRIGHT_SKIP_TWIN: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace
        run: pnpm -r build
      - name: Package (universal)
        working-directory: apps/ide
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out "chipwright-universal.vsix"
      - name: Publish to the VS Code Marketplace
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/ide
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set (see apps/ide/PUBLISHING.md)." >&2
            exit 1
          fi
          npx --yes @vscode/vsce@latest publish --no-dependencies --packagePath "chipwright-universal.vsix"
      - name: Publish to Open VSX (optional; runs only when OVSX_PAT is set)
        if: ${{ inputs.dry_run != true && env.OVSX_PAT != '' }}
        working-directory: apps/ide
        run: npx --yes ovsx@latest publish "chipwright-universal.vsix" -p "$OVSX_PAT"
      - name: Upload the .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chipwright-universal
          path: apps/ide/chipwright-universal.vsix
