name: Publish extension

# Publishes the OpenHome Studio VS Code extension. Trigger by pushing a tag that matches the
# extension version, e.g. ide-v0.1.0 (the tag suffix must equal apps/ide/package.json version).
# workflow_dispatch runs the same steps and can package without publishing (dry_run) to rehearse.
on:
  push:
    tags:
      - "ide-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package only; do not publish"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm -r build

      - name: Verify the tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./apps/ide/package.json').version")
          tag="${GITHUB_REF_NAME#ide-v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag ide-v$tag does not match apps/ide/package.json version $version." >&2
            exit 1
          fi

      - name: Package the .vsix
        working-directory: apps/ide
        run: npx --yes @vscode/vsce@latest package --no-dependencies --out openhome-studio.vsix

      - name: Publish to the VS Code Marketplace
        if: ${{ inputs.dry_run != true }}
        working-directory: apps/ide
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set. Add it in Settings > Secrets and variables > Actions (see apps/ide/PUBLISHING.md)." >&2
            exit 1
          fi
          npx --yes @vscode/vsce@latest publish --no-dependencies --packagePath openhome-studio.vsix

      - name: Publish to Open VSX (optional; runs only when OVSX_PAT is set)
        if: ${{ inputs.dry_run != true && env.OVSX_PAT != '' }}
        working-directory: apps/ide
        run: npx --yes ovsx@latest publish openhome-studio.vsix -p "$OVSX_PAT"

      - name: Upload the .vsix as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhome-studio-vsix
          path: apps/ide/openhome-studio.vsix

      - name: Attach the .vsix to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/ide
        run: |
          gh release create "$GITHUB_REF_NAME" openhome-studio.vsix \
            --title "OpenHome Studio $GITHUB_REF_NAME" \
            --notes "OpenHome Studio VS Code extension $GITHUB_REF_NAME" \
          || gh release upload "$GITHUB_REF_NAME" openhome-studio.vsix --clobber
