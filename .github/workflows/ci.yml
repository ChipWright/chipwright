name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test TypeScript packages
        run: pnpm -r test

      - name: Run firmware unit tests
        run: make -C sdk/firmware test

      - name: Host compile check of ESP32 BSP
        run: make -C sdk/firmware hostcheck-esp32

      - name: Build and run reference firmware
        run: make -C sdk/firmware/examples/thermostat run

      - name: Run simulator unit tests
        run: make -C simulator test

      - name: Run the digital-twin demonstration
        run: make -C simulator example

      - name: Build and smoke-test the twin studio binary
        run: |
          make -C simulator/examples/twin_studio
          simulator/examples/twin_studio/build/twin_studio --ticks 3 --interval-ms 0 --fault stuck --fault-at 1

      - name: Run protocol layer unit tests
        run: make -C protocols test

      - name: Run the Matter commissioning demonstration
        run: make -C protocols example

      - name: Run the device acceptance suite
        run: make -C tests test
